<text x="60.0" y="654.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">McNemar p = 0.372 — not significant. We report no significant advantage rather than the 13.6-point win the naive</text>
