<text x="578.5" y="239.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">but these two ran the same logic.</text>
<text x="578.5" y="259.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#52514e" text-anchor="start">This is the noise floor.</text>
