<text x="60.0" y="536.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">The localiser catches 100% of every fault class it was designed for. The defects have simply become rare:</text>
<text x="60.0" y="560.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">87% of observed failures are semantic — the wiring is perfect, the expected answer is wrong.</text>
