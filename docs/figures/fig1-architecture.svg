<line x1="60" y1="1024" x2="1500" y2="1024" stroke="#e6e5e1" stroke-width="1.5"/>
<text x="60.0" y="1058.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">We generate the circuit too · we parse the Verilog before running anything · we turn findings into instructions ·</text>
<text x="60.0" y="1084.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">we added a blind-retry control arm. The rest of the talk is whether those four things worked.</text>
<text x="60.0" y="1110.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a7974" text-anchor="start">AutoBench never parses the Verilog it produces, and has no control arm — those two gaps are what this project builds on.</text>
