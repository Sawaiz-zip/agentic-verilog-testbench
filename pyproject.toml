[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-verilog-testbench"
version = "0.1.0"
description = "Agentic Verilog testbench generation: a LangGraph pipeline that writes HDL testbenches from natural language, localises structural faults with Pyverilog before simulation, and repairs them from structured feedback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "anthropic>=0.40.0",
    "pyverilog>=1.3.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pipeline = "pipeline.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: test hits the real LLM API; skipped automatically without an API key",
]
